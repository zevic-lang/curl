name: ci

# Every push to main and every pull request builds zevic and runs the tests on Linux, macOS and Windows.
# On Linux the tests also talk to an HTTPS server with a self-signed certificate (`openssl s_server`), so that
# the check of certificates is tested for real. On macOS those two tests do nothing (they say so).
#
# A push to main that passes the tests also releases: when the `version` in zevic.toml has no tag yet,
# the release job creates the tag vX.Y.Z and a GitHub release (the notes are the `## X.Y.Z` section of CHANGELOG.md).
# To release: raise `version` in zevic.toml, add a `## X.Y.Z` section to CHANGELOG.md, push to main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # the zevic that builds and tests the package
  ZEVIC_REF: v0.4.6

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      ZEVIC_HOME: ${{ github.workspace }}/zevic
      ZEVIC: ${{ github.workspace }}/zevic/build/zevic
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: zevic-lang/zevic
          ref: ${{ env.ZEVIC_REF }}
          path: zevic

      # zevic turns Zevic into LLVM IR and asks clang to build it; macOS has clang and libcurl already
      - name: Install clang, libcurl and openssl (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libcurl4-openssl-dev openssl

      # Windows: a current clang (the C++ headers of Visual Studio need Clang 22 or newer) and libcurl from vcpkg
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        run: |
          LLVM="/c/Program Files/LLVM/bin"
          major=0
          if [ -x "$LLVM/clang.exe" ]; then
            major=$("$LLVM/clang.exe" --version | sed -n 's/.*clang version \([0-9]*\).*/\1/p' | head -n 1)
          fi
          if [ "${major:-0}" -lt 22 ]; then
            winget install --id LLVM.LLVM -e --silent --force --accept-package-agreements --accept-source-agreements || true
          fi
          echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"

      - name: Install libcurl (Windows, vcpkg)
        if: runner.os == 'Windows'
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg.exe" install curl:x64-windows
          V="$(cygpath -m "$VCPKG_INSTALLATION_ROOT")/installed/x64-windows"
          # zevic.toml asks for `curl`; vcpkg names the import library libcurl.lib
          cp "$V/lib/libcurl.lib" "$V/lib/curl.lib"
          echo "CPATH=$V/include" >> "$GITHUB_ENV"
          echo "LIB=$V/lib" >> "$GITHUB_ENV"
          echo "$V/bin" >> "$GITHUB_PATH"

      - name: Build zevic
        run: make -C zevic

      - name: Test
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # an HTTPS server with a certificate for localhost that no store trusts
            TLS="$RUNNER_TEMP/tls"
            mkdir -p "$TLS"
            openssl req -x509 -newkey rsa:2048 -nodes -keyout "$TLS/key.pem" -out "$TLS/cert.pem" -days 2 \
              -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
            openssl s_server -accept 8443 -cert "$TLS/cert.pem" -key "$TLS/key.pem" -www -quiet > "$TLS/s_server.log" 2>&1 &
            trap 'kill $!' EXIT
            sleep 1
            export CURL_TEST_HTTPS_URL="https://localhost:8443/" CURL_TEST_CA_FILE="$TLS/cert.pem"
          fi
          zevic/build/zevpm test

      - name: Build the fetch example
        working-directory: examples/fetch
        run: ../../zevic/build/zevpm build

  release:
    name: release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release the version in zevic.toml if it has no tag yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME="$(sed -n 's/^name = "\(.*\)"/\1/p' zevic.toml | head -n 1)"
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' zevic.toml | head -n 1)"
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists: nothing to release"
            exit 0
          fi
          # the changelog has to describe the version that is released
          grep -q "^## $VERSION\$" CHANGELOG.md
          awk -v v="$VERSION" '$0 == "## " v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          git archive --format=tar.gz --prefix="$NAME-$VERSION/" -o "$NAME-$VERSION.tar.gz" HEAD
          gh release create "$TAG" "$NAME-$VERSION.tar.gz" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
          echo "released $TAG"
